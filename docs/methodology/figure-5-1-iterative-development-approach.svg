<text x="560" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#3F748A" text-anchor="middle">MoSCoW selects scope</text>
<text x="1375" y="806" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#3F748A" text-anchor="middle">Must Have scope</text>
<text x="714" y="642" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3F748A" text-anchor="middle">learning informs reprioritisation</text>
<rect x="1435" y="1040" width="400" height="64" rx="18" fill="#FBFAF6" stroke="#D4DDD6" stroke-width="1.7"/>
<text x="1470" y="1068" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#65736B" text-anchor="start">SECONDARY FEATURES</text>
<text x="1470" y="1092" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#24372F" text-anchor="start">Add when time and priority allow</text>
<text x="92" y="1190" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#65736B" text-anchor="start">Figure 5.1: Iterative Development Approach for the Grand Pa’s Cold Store Management System</text>
