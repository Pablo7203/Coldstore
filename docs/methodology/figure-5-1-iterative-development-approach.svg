<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280">
<title>Figure 5.1: Iterative Development Approach for the Grand Pa’s Cold Store Management System</title>
<desc>Diagram of an iterative DSDM development cycle, guided by MoSCoW priorities within a fixed academic timeframe.</desc>
<defs>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3E6B54"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3F748A"/></marker>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#e8e7df" stroke-width="1"/></pattern>
</defs>
<rect width="1920" height="1280" fill="#FBFAF6"/>
